name: Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
              docker build -t saurabhxkumarx/sonix-music-app:latest \
                 -t saurabhxkumarx/sonix-music-app:${{ github.sha }} \
                 ./server

      - name: Push image
        run: |
              docker push saurabhxkumarx/sonix-music-app:latest
              docker push saurabhxkumarx/sonix-music-app:${{ github.sha }}


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/sonix/sonix_music_app/server
            docker compose pull
            docker compose up -d
            docker image prune -f
